name: Publish Scheduled Articles

# Runs every day at 9:00 AM EST (13:00 UTC)
# Also runs on manual trigger via GitHub Actions UI
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run scheduled publisher
        id: publish
        run: |
          python .github/scripts/publish_scheduled.py
        env:
          TZ: America/New_York

      - name: Commit and push if articles were published
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-publish scheduled articles ($(date +%Y-%m-%d))"
          git push

name: YMYL Primary-Source Watcher

# Layer 2 of the YMYL verification system. Runs every Monday 13:00 UTC,
# fetches the 7 monitored primary sources (IRS 25C, IRS 25D, ENERGY STAR
# Federal Credits, EPA Section 608, EPA AIM Act, DOE Heat Pump Systems,
# DOE Home Upgrades), diffs against last week's snapshot, opens a GitHub
# issue if any source has a material text change.
#
# The issue is the actionable handoff: when one fires, run
# `python scripts/ymyl_source_watcher.py` locally, read .ymyl_snapshots/
# _report.md, and decide if any article needs a YMYL log refresh.

on:
  schedule:
    - cron: '0 13 * * 1'  # Mondays at 13:00 UTC
  workflow_dispatch:        # allow manual trigger from Actions UI

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run YMYL source watcher
        id: watcher
        run: |
          python scripts/ymyl_source_watcher.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Read report
        if: always()
        id: report
        run: |
          if [ -f .ymyl_snapshots/_report.md ]; then
            REPORT_BODY=$(cat .ymyl_snapshots/_report.md)
            # Truncate to GitHub issue body limit
            REPORT_BODY="${REPORT_BODY:0:60000}"
            {
              echo "report<<EOF"
              echo "$REPORT_BODY"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Open issue on material change
        if: steps.watcher.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.report.outputs.report }}\n\n---\n\n**Action required:** review the diffs above and determine which articles' YMYL claims need re-verification. Then run \`python scripts/ymyl_source_watcher.py\` locally to refresh snapshots, edit affected articles, and bump their inline YMYL log dates.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[YMYL Watcher] Primary-source change detected — ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['ymyl', 'verification']
            });

      - name: Commit refreshed snapshots
        if: steps.watcher.outputs.exit_code == '1' || steps.watcher.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ymyl_snapshots/
          git diff --cached --quiet || git commit -m "ymyl-watcher: refresh snapshots ($(date +%Y-%m-%d))"
          git push || true
